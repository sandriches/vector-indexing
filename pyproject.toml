[project]
name = "vector-index"
version = "0.1.0"
description = "Learning project: vector indexes built from scratch in NumPy, measured against brute force."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.23",
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
